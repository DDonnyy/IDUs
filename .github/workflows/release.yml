name: Prepare draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft-release:
    name: Build and prepare release for review
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag matches VERSION
        run: python scripts/check_repository.py --release-tag "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/build_release.py
      - name: Create an unpublished release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/idus-*.zip dist/idus-*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
