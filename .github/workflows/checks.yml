name: Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test helpers, proposal contracts and isolated packages
        run: python -m unittest discover -s scripts/tests -v
  repository:
    name: Repository and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: idus-packages
          path: |
            dist/idus-*.zip
            dist/idus-*.sha256
          if-no-files-found: error
          retention-days: 14
  required:
    name: Required checks
    needs: [test, repository]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          if [ "$TEST_RESULT" != success ] || [ "$REPOSITORY_RESULT" != success ]; then
            echo "A required test or repository check did not succeed."
            exit 1
          fi
